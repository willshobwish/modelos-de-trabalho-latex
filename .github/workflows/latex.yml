name: LaTeX

on:
  push:
    branches: ['**']
    paths:
      - 'apresentacao_*/**'
      - 'documento_*/**'
      - 'modelo_*/**'
      - '.github/workflows/latex.yml'
      - 'scripts/**'
      - '.gitattributes'
  pull_request:
    paths:
      - 'apresentacao_*/**'
      - 'documento_*/**'
      - 'modelo_*/**'
      - '.github/workflows/latex.yml'
      - 'scripts/**'
      - '.gitattributes'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  detect:
    name: Selecionar modelos
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.models.outputs.models }}
    steps:
      - name: Baixar histórico para comparar alterações
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identificar modelos alterados
        id: models
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/affected_models.py >> "$GITHUB_OUTPUT"

  build:
    name: Compilar ${{ matrix.model }}
    needs: detect
    if: needs.detect.outputs.models != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.detect.outputs.models) }}
    steps:
      - name: Baixar fontes e imagens do Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Compilar PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: ${{ matrix.model }}
          texlive_version: '2026'

      - name: Guardar log se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.model }}
          path: ${{ matrix.model }}/main.log
          if-no-files-found: ignore

      - name: Validar pacote do modelo
        run: python3 scripts/package_release.py "${{ matrix.model }}" dist

      - name: Guardar arquivos da release
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.model }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Anexar arquivos à release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reunir ZIPs e PDFs
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Anexar à release publicada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
